# 读写分离配置文件
# 使用方式: --spring.profiles.active=replication

spring:
  # 多数据源配置
  datasource:
    # 主库配置（写操作）
    master:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${MASTER_DB_HOST:localhost}:${MASTER_DB_PORT:3306}/${DB_NAME:ev_charging_system}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
      username: ${MASTER_DB_USERNAME:root}
      password: ${MASTER_DB_PASSWORD:root123456}
      hikari:
        pool-name: MasterHikariPool
        maximum-pool-size: ${MASTER_HIKARI_MAX_POOL_SIZE:20}
        minimum-idle: ${MASTER_HIKARI_MIN_IDLE:5}
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
    
    # 从库1配置（读操作）
    slave1:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${SLAVE1_DB_HOST:localhost}:${SLAVE1_DB_PORT:3307}/${DB_NAME:ev_charging_system}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
      username: ${SLAVE1_DB_USERNAME:root}
      password: ${SLAVE1_DB_PASSWORD:root123456}
      hikari:
        pool-name: Slave1HikariPool
        maximum-pool-size: ${SLAVE1_HIKARI_MAX_POOL_SIZE:30}
        minimum-idle: ${SLAVE1_HIKARI_MIN_IDLE:10}
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
        read-only: true
    
    # 从库2配置（读操作）
    slave2:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${SLAVE2_DB_HOST:localhost}:${SLAVE2_DB_PORT:3308}/${DB_NAME:ev_charging_system}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
      username: ${SLAVE2_DB_USERNAME:root}
      password: ${SLAVE2_DB_PASSWORD:root123456}
      hikari:
        pool-name: Slave2HikariPool
        maximum-pool-size: ${SLAVE2_HIKARI_MAX_POOL_SIZE:30}
        minimum-idle: ${SLAVE2_HIKARI_MIN_IDLE:10}
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
        read-only: true

# 主从复制监控配置
replication:
  monitor:
    enabled: true
    interval: 10000  # 监控间隔（毫秒），默认10秒
    lag-threshold: 5  # 延迟告警阈值（秒），默认5秒
  
  health-check:
    enabled: true
    interval: 5000  # 健康检查间隔（毫秒），默认5秒
    timeout: 3000  # 连接超时（毫秒），默认3秒
