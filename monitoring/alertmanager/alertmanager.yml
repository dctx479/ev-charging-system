# Alertmanager 配置文件
# EV Charging System Alert Manager Configuration

global:
  resolve_timeout: 5m  # 告警自动解决超时时间

  # SMTP 配置（邮件告警）- 生产环境需配置实际SMTP服务器
  smtp_from: '${SMTP_FROM:alertmanager@ev-charging.com}'
  smtp_smarthost: '${SMTP_HOST:smtp.example.com:587}'
  smtp_auth_username: '${SMTP_USER:alertmanager@ev-charging.com}'
  smtp_auth_password: '${SMTP_PASSWORD:}'
  smtp_require_tls: true

# 路由配置
route:
  # 默认接收器
  receiver: 'default'

  # 分组标签：相同标签的告警会被分组
  group_by: ['alertname', 'severity', 'category']

  # 分组等待时间：等待更多告警到达后再发送
  group_wait: 10s

  # 分组间隔：同一分组的告警再次发送的间隔
  group_interval: 5m

  # 重复间隔：同一告警重复发送的间隔
  repeat_interval: 4h

  # 子路由
  routes:
    # 严重告警：立即通知，使用多种方式
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      group_interval: 2m
      repeat_interval: 30m
      continue: true  # 继续匹配后续规则

    # 警告告警：正常通知
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h

    # 信息告警：较低优先级
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h

    # 业务相关告警：通知业务团队
    - match:
        category: business
      receiver: 'business-alerts'
      group_wait: 30s
      repeat_interval: 2h

    # 数据库告警：通知 DBA 团队
    - match_re:
        alertname: '.*MySQL.*|.*Redis.*'
      receiver: 'database-alerts'
      group_wait: 30s
      repeat_interval: 1h

# 抑制规则：避免告警风暴
inhibit_rules:
  # 如果应用宕机，抑制所有其他应用告警
  - source_match:
      alertname: 'ApplicationDown'
      severity: 'critical'
    target_match:
      job: 'ev-charging-backend'
    equal: ['instance']

  # 如果内存极高，抑制内存警告
  - source_match:
      alertname: 'CriticalJVMMemoryUsage'
      severity: 'critical'
    target_match:
      alertname: 'HighJVMMemoryUsage'
      severity: 'warning'
    equal: ['instance']

  # 如果响应时间极慢，抑制一般慢告警
  - source_match:
      alertname: 'VeryHighResponseTime'
      severity: 'critical'
    target_match:
      alertname: 'HighResponseTime'
      severity: 'warning'
    equal: ['instance']

# 接收器配置
receivers:
  # 默认接收器
  - name: 'default'
    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/webhook/alert'
        send_resolved: true

  # 严重告警接收器：多种通知方式
  - name: 'critical-alerts'
    # 邮件通知
    email_configs:
      - to: 'ops-team@ev-charging.com,dev-lead@ev-charging.com'
        headers:
          Subject: '[CRITICAL] 充电系统严重告警'
        html: |
          <h2>严重告警通知</h2>
          <p><strong>告警名称:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>严重程度:</strong> {{ .GroupLabels.severity }}</p>
          <p><strong>分类:</strong> {{ .GroupLabels.category }}</p>
          <h3>告警详情:</h3>
          {{ range .Alerts }}
          <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
            <p><strong>摘要:</strong> {{ .Annotations.summary }}</p>
            <p><strong>描述:</strong> {{ .Annotations.description }}</p>
            <p><strong>开始时间:</strong> {{ .StartsAt }}</p>
            {{ if .EndsAt }}<p><strong>结束时间:</strong> {{ .EndsAt }}</p>{{ end }}
          </div>
          {{ end }}

    # 钉钉机器人通知（需配置实际access_token）
    webhook_configs:
      - url: '${DINGTALK_CRITICAL_WEBHOOK:http://host.docker.internal:8080/api/webhook/alert/dingtalk}'
        send_resolved: true

      # 企业微信机器人通知（需配置实际key）
      - url: '${WECHAT_CRITICAL_WEBHOOK:http://host.docker.internal:8080/api/webhook/alert/wechat}'
        send_resolved: true

      # 自定义 Webhook
      - url: 'http://host.docker.internal:8080/api/webhook/alert/critical'
        send_resolved: true

  # 警告告警接收器
  - name: 'warning-alerts'
    email_configs:
      - to: 'ops-team@ev-charging.com'
        headers:
          Subject: '[WARNING] 充电系统警告告警'

    webhook_configs:
      - url: '${DINGTALK_WARNING_WEBHOOK:http://host.docker.internal:8080/api/webhook/alert/dingtalk}'
        send_resolved: true

      - url: 'http://host.docker.internal:8080/api/webhook/alert/warning'
        send_resolved: true

  # 信息告警接收器
  - name: 'info-alerts'
    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/webhook/alert/info'
        send_resolved: true

  # 业务告警接收器
  - name: 'business-alerts'
    email_configs:
      - to: 'business-team@ev-charging.com'
        headers:
          Subject: '[BUSINESS] 充电系统业务告警'

    webhook_configs:
      - url: '${DINGTALK_BUSINESS_WEBHOOK:http://host.docker.internal:8080/api/webhook/alert/dingtalk}'
        send_resolved: true

      - url: 'http://host.docker.internal:8080/api/webhook/alert/business'
        send_resolved: true

  # 数据库告警接收器
  - name: 'database-alerts'
    email_configs:
      - to: 'dba-team@ev-charging.com'
        headers:
          Subject: '[DATABASE] 充电系统数据库告警'

    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/webhook/alert/database'
        send_resolved: true

# 告警模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'
