# Prometheus 配置文件
# EV Charging System Monitoring Configuration

global:
  scrape_interval: 15s     # 抓取间隔
  evaluation_interval: 15s # 规则评估间隔
  scrape_timeout: 10s      # 抓取超时

  # 全局标签
  external_labels:
    cluster: 'ev-charging-system'
    environment: 'production'

# 告警规则文件
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

# 抓取任务配置
scrape_configs:
  # Spring Boot 应用
  - job_name: 'ev-charging-backend'
    metrics_path: '/api/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'ev-charging-system'
          service: 'backend'
          environment: 'production'
    # 健康检查
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  # MySQL Exporter
  - job_name: 'mysql'
    scrape_interval: 15s
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          environment: 'production'

  # Redis Exporter
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          environment: 'production'

  # RabbitMQ Exporter
  - job_name: 'rabbitmq'
    scrape_interval: 15s
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          environment: 'production'

  # Node Exporter (系统指标)
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          environment: 'production'

  # Prometheus 自身监控
  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'production'

  # Grafana 监控
  - job_name: 'grafana'
    scrape_interval: 15s
    static_configs:
      - targets: ['grafana:3000']
        labels:
          environment: 'production'
